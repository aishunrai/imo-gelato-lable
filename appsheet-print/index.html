<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18271f">
  <title>製造ラベル印刷</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: #f3f5f2;
      color: #18271f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 20px 16px 40px; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin: 12px 0 6px; font-size: 1.5rem; }
    .lead { margin: 0 0 20px; color: #526157; }
    .card {
      background: #fff;
      border: 1px solid #dfe6e1;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(24, 39, 31, .08);
      overflow: hidden;
    }
    dl { margin: 0; }
    .row {
      display: grid;
      grid-template-columns: 7.5rem 1fr;
      gap: 12px;
      padding: 15px 18px;
      border-bottom: 1px solid #edf0ed;
    }
    .row:last-child { border-bottom: 0; }
    dt { color: #6a766e; }
    dd { margin: 0; font-weight: 650; overflow-wrap: anywhere; }
    .actions { display: grid; gap: 10px; margin-top: 18px; }
    button {
      min-height: 52px;
      border-radius: 12px;
      border: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #print { background: #176b3a; color: #fff; }
    #print:disabled { background: #94a49a; cursor: not-allowed; }
    #back { background: #e5ebe7; color: #25382d; }
    #message { min-height: 1.5em; margin: 14px 2px 0; color: #526157; }
    .error { color: #a12424 !important; }
    .note { margin-top: 20px; font-size: .86rem; color: #6a766e; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>製造ラベル印刷</h1>
    <p class="lead">内容を確認して、ラベルを印刷してください。</p>

    <section class="card" aria-label="印刷内容">
      <dl>
        <div class="row"><dt>製造日</dt><dd id="date">—</dd></div>
        <div class="row"><dt>フレーバー</dt><dd id="flavor">—</dd></div>
        <div class="row"><dt>担当者</dt><dd id="staff">—</dd></div>
        <div class="row"><dt>ロットID</dt><dd id="lot">—</dd></div>
        <div class="row"><dt>印刷枚数</dt><dd id="copies">—</dd></div>
      </dl>
    </section>

    <div class="actions">
      <button id="print" type="button">ラベルを印刷</button>
      <button id="back" type="button">AppSheetへ戻る</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="note">印刷ボタンを押すとBrother Smooth Printが起動します。既存のラベル印刷画面・テンプレートとは別系統です。</p>
  </main>

  <script>
    (() => {
      "use strict";

      // 個人名やロット情報をWebサーバーへ送らないよう、AppSheetからはURLの
      // クエリではなくフラグメント（#以降）で受け取る。
      const params = new URLSearchParams(location.hash.replace(/^#/, ""));
      const values = {
        date: params.get("date") || "",
        flavor: params.get("flavor") || "",
        staff: params.get("staff") || "",
        lot: params.get("lot") || "",
        copies: Number.parseInt(params.get("copies") || "1", 10)
      };

      const fields = ["date", "flavor", "staff", "lot", "copies"];
      for (const field of fields) {
        document.getElementById(field).textContent = String(values[field] || "—");
      }

      const errors = [];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(values.date)) errors.push("製造日");
      if (!values.flavor || values.flavor.length > 80) errors.push("フレーバー");
      if (!values.staff || values.staff.length > 80) errors.push("担当者");
      if (!values.lot || values.lot.length > 120) errors.push("ロットID");
      if (!Number.isInteger(values.copies) || values.copies < 1 || values.copies > 20) errors.push("印刷枚数");

      const printButton = document.getElementById("print");
      const message = document.getElementById("message");

      if (errors.length) {
        printButton.disabled = true;
        message.classList.add("error");
        message.textContent = `印刷情報を確認してください：${errors.join("、")}`;
      }

      const add = (search, key, value) => search.set(key, value);

      printButton.addEventListener("click", () => {
        const search = new URLSearchParams();
        add(search, "filename", "gelato-appsheet-v1.lbx");
        add(search, "size", "DieCutW62H29");
        add(search, "copies", String(values.copies));
        add(search, "text_DATE", values.date);
        add(search, "text_FLAVOR", values.flavor);
        add(search, "text_STAFF", values.staff);
        add(search, "barcode_LOT", values.lot);

        message.classList.remove("error");
        message.textContent = "Brother Smooth Printを起動しています…";
        location.href = `brotherwebprint://print?${search.toString()}`;
      });

      document.getElementById("back").addEventListener("click", () => history.back());
    })();
  </script>
</body>
</html>
