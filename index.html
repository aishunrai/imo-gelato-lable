<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smooth Print テスト</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
    }

    h1 {
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    p {
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Smooth Print テスト</h1>

  <p>
    test62.lbx を使用して、QL-820NWBからテスト印刷します_2。
  </p>

  <button type="button" onclick="printTest()">
    テスト印刷
  </button>

  <div id="message"></div>

</div>

<script>

function printTest() {

  const message = document.getElementById("message");

  const smoothPrintUrl =
    "brotherwebprint://print"
    + "?filename=" + encodeURIComponent("test62.lbx")
    + "&copies=1"
    + "&paperType=dieCut"
    + "&tapeWidth=62"
    + "&tapeLength=29"
    + "&unit=mm";

  message.textContent = "Smooth Printを起動します...";

  window.location.href = smoothPrintUrl;
}

</script>

</body>
</html>
