<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Print テスト</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 20px;
    }
  </style>
</head>

<body>

<h2>Smooth Print テスト</h2>

<p>62mm無定長ロールでテスト印刷します。</p>

<button type="button" onclick="printTest()">
  テスト印刷
</button>

<script>
function printTest() {

  const smoothPrintUrl =
    "brotherwebprint://print"
    + "?filename=" + encodeURIComponent("test.lbx")
    + "&size=" + encodeURIComponent("RollW62RB")
    + "&copies=1";

  window.location.href = smoothPrintUrl;
}
</script>

</body>
</html>
